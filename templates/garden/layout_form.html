{% extends "base.html" %}
{% block title %}{{ title }} — Groundwork{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg">
  <h1 class="mb-6 text-3xl">{{ title }}</h1>
  <form method="post" class="card space-y-4">
    {% csrf_token %}
    {% for field in form %}
    <div>
      <label class="label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<p class="mt-1 text-sm text-red-600">{{ field.errors|striptags }}</p>{% endif %}
    </div>
    {% endfor %}
    <div class="flex gap-2">
      <button type="submit" class="btn-primary">Save</button>
      <a href="{% if layout %}{{ layout.get_absolute_url }}{% else %}{% url 'layout_list' %}{% endif %}" class="btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
